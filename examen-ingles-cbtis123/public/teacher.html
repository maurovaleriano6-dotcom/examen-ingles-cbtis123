<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel del Maestro - Resultados del Examen</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    .card {
        background: rgba(255,255,255,0.97);
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        border: 2px solid #0047ab;
        margin-bottom: 20px;
    }
    h1 { color: #0047ab; margin-bottom: 15px; }
    .login-box { max-width: 420px; margin: 60px auto; text-align: center; }
    .login-box input {
        width: 100%; padding: 14px; margin: 15px 0; border: 2px solid #ddd;
        border-radius: 10px; font-size: 16px;
    }
    button {
        background: linear-gradient(135deg, #0047ab, #0066cc);
        color: white; border: none; padding: 12px 24px; border-radius: 10px;
        font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    button.secondary { background: #6c757d; }
    button.danger { background: #dc3545; padding: 6px 12px; font-size: 13px; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
    .stats-row { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; }
    .stat-box {
        background: #e3f2fd; border-left: 4px solid #0047ab; border-radius: 8px;
        padding: 15px 20px; flex: 1; min-width: 140px;
    }
    .stat-box .num { font-size: 1.8em; font-weight: bold; color: #0047ab; }
    .stat-box .label { color: #555; font-size: 0.9em; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #0047ab; color: white; position: sticky; top: 0; }
    tr.cheat-row { background: #ffebee; }
    tr.cheat-row:hover { background: #ffcdd2; }
    tr:hover:not(.cheat-row) { background: #f5f7fa; }
    .badge { padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    .badge-ok { background: #d4edda; color: #155724; }
    .badge-cheat { background: #f8d7da; color: #721c24; }
    .table-wrap { overflow-x: auto; }
    #errorMsg { color: #c0392b; margin-top: 10px; font-weight: bold; }
    .empty-msg { text-align: center; color: #777; padding: 30px; }
</style>
</head>
<body>
<div class="container">

    <!-- Pantalla de acceso -->
    <div class="card login-box" id="loginBox">
        <h1>🔐 Panel del Maestro</h1>
        <p>Ingresa la contraseña para ver los resultados</p>
        <input type="password" id="passwordInput" placeholder="Contraseña" />
        <button onclick="login()" style="width:100%">Entrar</button>
        <p id="errorMsg"></p>
    </div>

    <!-- Panel principal (oculto hasta iniciar sesión) -->
    <div id="dashboard" style="display:none">
        <div class="card">
            <h1>📊 Resultados del Examen de Inglés</h1>
            <div class="toolbar">
                <button onclick="loadResults()">🔄 Actualizar</button>
                <button onclick="downloadExcel()">📥 Descargar Excel</button>
                <button class="secondary" onclick="logout()">🚪 Salir</button>
            </div>
            <div class="stats-row" id="statsRow"></div>
        </div>

        <div class="card">
            <div class="table-wrap">
                <table id="resultsTable">
                    <thead>
                        <tr>
                            <th>ID</th><th>Nombre</th><th>Grupo</th><th>Puntuación</th>
                            <th>%</th><th>Fecha</th><th>Duración</th><th>Cambios Pestaña</th>
                            <th>Salidas Pantalla</th><th>¿Trampa?</th><th>Razón</th><th>Estatus</th><th></th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody"></tbody>
                </table>
                <div class="empty-msg" id="emptyMsg" style="display:none">Aún no hay resultados registrados.</div>
            </div>
        </div>
    </div>
</div>

<script>
let password = '';

function login() {
    password = document.getElementById('passwordInput').value;
    if (!password) return;
    loadResults();
}

function logout() {
    password = '';
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('loginBox').style.display = 'block';
    document.getElementById('passwordInput').value = '';
}

async function loadResults() {
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.textContent = '';
    try {
        const res = await fetch('/api/results?password=' + encodeURIComponent(password));
        if (res.status === 401) {
            errorMsg.textContent = '❌ Contraseña incorrecta';
            return;
        }
        const data = await res.json();
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        renderResults(data.results || []);
    } catch (err) {
        errorMsg.textContent = '❌ No se pudo conectar con el servidor';
    }
}

function renderResults(results) {
    const tbody = document.getElementById('resultsBody');
    const emptyMsg = document.getElementById('emptyMsg');
    tbody.innerHTML = '';

    if (results.length === 0) {
        emptyMsg.style.display = 'block';
    } else {
        emptyMsg.style.display = 'none';
    }

    // Estadísticas rápidas
    const total = results.length;
    const cheaters = results.filter(r => r.cheating_detected).length;
    const completed = results.filter(r => r.status === 'completado').length;
    const avg = total ? Math.round(results.reduce((s, r) => s + r.percentage, 0) / total) : 0;

    document.getElementById('statsRow').innerHTML = `
        <div class="stat-box"><div class="num">${total}</div><div class="label">Exámenes registrados</div></div>
        <div class="stat-box"><div class="num">${completed}</div><div class="label">Completados</div></div>
        <div class="stat-box"><div class="num">${cheaters}</div><div class="label">Con actividad sospechosa</div></div>
        <div class="stat-box"><div class="num">${avg}%</div><div class="label">Promedio general</div></div>
    `;

    results.forEach(r => {
        const tr = document.createElement('tr');
        if (r.cheating_detected) tr.classList.add('cheat-row');
        tr.innerHTML = `
            <td>${r.id}</td>
            <td>${escapeHtml(r.name)}</td>
            <td>${escapeHtml(r.student_group)}</td>
            <td>${r.score}/${r.total_questions}</td>
            <td>${r.percentage}%</td>
            <td>${escapeHtml(r.exam_date || '')}</td>
            <td>${escapeHtml(r.duration || '')}</td>
            <td>${r.tab_switch_count}</td>
            <td>${r.fullscreen_exit_count}</td>
            <td>${r.cheating_detected ? '<span class="badge badge-cheat">SÍ</span>' : '<span class="badge badge-ok">No</span>'}</td>
            <td>${escapeHtml(r.block_reason || '-')}</td>
            <td>${escapeHtml(r.status)}</td>
            <td><button class="danger" onclick="deleteResult(${r.id})">Borrar</button></td>
        `;
        tbody.appendChild(tr);
    });
}

async function deleteResult(id) {
    if (!confirm('¿Seguro que quieres borrar este registro?')) return;
    await fetch('/api/results/' + id + '?password=' + encodeURIComponent(password), { method: 'DELETE' });
    loadResults();
}

function downloadExcel() {
    window.location.href = '/api/export/xlsx?password=' + encodeURIComponent(password);
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
}

// Permitir Enter en el campo de contraseña
document.getElementById('passwordInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') login();
});
</script>
</body>
</html>
